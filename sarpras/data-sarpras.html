</div>


<!-- MODAL TAMBAH -->
<div class="modal" id="modalTambah">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Tambah Sarpras</h2>

            <span
                class="close"
                onclick="tutupModal()"
            >
                &times;
            </span>

        </div>


        <form id="formSarpras">

            <div class="form-group">

                <label>
                    Nama Sarana/Prasarana
                </label>

                <input
                    type="text"
                    id="namaSarpras"
                    placeholder="Contoh: Proyektor"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Kategori
                </label>

                <select
                    id="kategori"
                    required
                >

                    <option value="">
                        -- Pilih Kategori --
                    </option>

                    <option value="Sarana">
                        Sarana
                    </option>

                    <option value="Prasarana">
                        Prasarana
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Kapasitas/Jumlah
                </label>

                <input
                    type="text"
                    id="kapasitas"
                    placeholder="Contoh: 5 unit"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Kondisi
                </label>

                <select
                    id="kondisi"
                    required
                >

                    <option value="Baik">
                        Baik
                    </option>

                    <option value="Rusak Ringan">
                        Rusak Ringan
                    </option>

                    <option value="Rusak Berat">
                        Rusak Berat
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select
                    id="status"
                    required
                >

                    <option value="Tersedia">
                        Tersedia
                    </option>

                    <option value="Dipinjam">
                        Dipinjam
                    </option>

                    <option value="Dalam Perawatan">
                        Dalam Perawatan
                    </option>

                    <option value="Tidak Tersedia">
                        Tidak Tersedia
                    </option>

                </select>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-cancel"
                    onclick="tutupModal()"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Simpan
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =========================================
   CEK LOGIN ADMIN / PIHAK SEKOLAH
========================================= */

const loggedIn =
    sessionStorage.getItem("siprasLoggedIn");

const role =
    sessionStorage.getItem("siprasRole");


if (
    loggedIn !== "true" ||
    role !== "sarpras"
) {

    window.location.href =
        "../login.html";

}


/* =========================================
   DATA LAMA
   DATA LAMA TETAP DIPERTAHANKAN
========================================= */

let dataSarpras = [

    {
        nama: "Aula Sekolah",
        kategori: "Prasarana",
        kapasitas: "200 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Ruang Serbaguna",
        kategori: "Prasarana",
        kapasitas: "100 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Lapangan Sekolah",
        kategori: "Prasarana",
        kapasitas: "300 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Lapangan Basket",
        kategori: "Prasarana",
        kapasitas: "30 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Lapangan Futsal",
        kategori: "Prasarana",
        kapasitas: "30 orang",

        status: "Tersedia"
    },

    {
        nama: "Ruang Kelas",
        kategori: "Prasarana",
        kapasitas: "36 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Lab. Komputer",
        kategori: "Prasarana",
        kapasitas: "40 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Lab. IPA",
        kategori: "Prasarana",
        kapasitas: "36 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Perpustakaan",
        kategori: "Prasarana",
        kapasitas: "50 orang",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Proyektor",
        kategori: "Sarana",
        kapasitas: "3 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Sound System",
        kategori: "Sarana",
        kapasitas: "2 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Microphone Wireless",
        kategori: "Sarana",
        kapasitas: "4 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Speaker Portable",
        kategori: "Sarana",
        kapasitas: "2 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Kursi",
        kategori: "Sarana",
        kapasitas: "200 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Meja",
        kategori: "Sarana",
        kapasitas: "50 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Papan Tulis",
        kategori: "Sarana",
        kapasitas: "10 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Kabel Roll",
        kategori: "Sarana",
        kapasitas: "10 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Tenda",
        kategori: "Sarana",
        kapasitas: "5 unit",
        kondisi: "Baik",
        status: "Tersedia"
    },

    {
        nama: "Layar Proyektor",
        kategori: "Sarana",
        kapasitas: "3 unit",
        kondisi: "Baik",
        status: "Tersedia"
    }

];


/* =========================================
   AMBIL DATA TAMBAHAN YANG SUDAH DISIMPAN
========================================= */

const dataTambahan =
    JSON.parse(
        localStorage.getItem("dataSarprasTambahan")
    ) || [];


/* Gabungkan data lama + data tambahan */

dataSarpras = [
    ...dataSarpras,
    ...dataTambahan
];


/* =========================================
   TAMPILKAN DATA
========================================= */

function tampilkanData(data = dataSarpras) {

    const table =
        document.getElementById("dataTable");

    table.innerHTML = "";


    if (data.length === 0) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    Belum ada data sarana dan prasarana.
                </td>
            </tr>
        `;

        return;
    }


    data.forEach((item, index) => {

        let statusClass = "tersedia";


        if (item.status === "Dipinjam") {
            statusClass = "dipinjam";
        }

        if (item.status === "Dalam Perawatan") {
            statusClass = "perawatan";
        }

        if (item.status === "Tidak Tersedia") {
            statusClass = "tidak";
        }


        let kondisiClass = "baik";


        if (item.kondisi === "Rusak Ringan") {
            kondisiClass = "rusak-ringan";
        }

        if (item.kondisi === "Rusak Berat") {
            kondisiClass = "rusak-berat";
        }


        table.innerHTML += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <strong>
                        ${item.nama}
                    </strong>
                </td>

                <td>
                    ${item.kategori}
                </td>

                <td>
                    ${item.kapasitas}
                </td>

                <td
                    class="${kondisiClass}"
                >
                    ${item.kondisi}
                </td>

                <td>

                    <span
                        class="badge ${statusClass}"
                    >
                        ${item.status}
                    </span>

                </td>

            </tr>

        `;

    });

}


/* =========================================
   SEARCH
========================================= */

function cariData() {

    const keyword =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase();


    const hasil =
        dataSarpras.filter(item =>

            item.nama
                .toLowerCase()
                .includes(keyword)

        );


    tampilkanData(hasil);

}


/* =========================================
   BUKA MODAL
========================================= */

function bukaModal() {

    document
        .getElementById("modalTambah")
        .style.display = "flex";


    document
        .getElementById("formSarpras")
        .reset();

}


/* =========================================
   TUTUP MODAL
========================================= */

function tutupModal() {

    document
        .getElementById("modalTambah")
        .style.display = "none";

}


/* =========================================
   SIMPAN SARPRAS BARU
========================================= */

document
    .getElementById("formSarpras")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const nama =
                document
                    .getElementById("namaSarpras")
                    .value
                    .trim();


            const kategori =
                document
                    .getElementById("kategori")
                    .value;


            const kapasitas =
                document
                    .getElementById("kapasitas")
                    .value
                    .trim();


            const kondisi =
                document
                    .getElementById("kondisi")
                    .value;


            const status =
                document
                    .getElementById("status")
                    .value;


            const sarprasBaru = {

                nama: nama,

                kategori: kategori,

                kapasitas: kapasitas,

                kondisi: kondisi,

                status: status

            };


            /* Tambahkan ke data yang sedang tampil */

            dataSarpras.push(sarprasBaru);


            /*
             * Simpan HANYA data tambahan.
             * Data lama tidak disentuh.
             */

            const dataTambahanSekarang =
                JSON.parse(
                    localStorage.getItem(
                        "dataSarprasTambahan"
                    )
                ) || [];


            dataTambahanSekarang.push(
                sarprasBaru
            );


            localStorage.setItem(

                "dataSarprasTambahan",

                JSON.stringify
