                    required
                >
            </div>

            <div class="form-group">
                <label>Kategori</label>
                <select id="kategori" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="Sarana">Sarana</option>
                    <option value="Prasarana">Prasarana</option>
                </select>
            </div>

            <div class="form-group">
                <label>Kapasitas/Jumlah</label>
                <input
                    type="text"
                    id="kapasitas"
                    placeholder="Contoh: 3 unit / 40 orang"
                    required
                >
            </div>

            <div class="form-group">
                <label>Kondisi</label>
                <select id="kondisi" required>
                    <option value="Baik">Baik</option>
                    <option value="Rusak Ringan">Rusak Ringan</option>
                    <option value="Rusak Berat">Rusak Berat</option>
                </select>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="status" required>
                    <option value="Tersedia">Tersedia</option>
                    <option value="Dipinjam">Dipinjam</option>
                    <option value="Dalam Perawatan">Dalam Perawatan</option>
                    <option value="Tidak Tersedia">Tidak Tersedia</option>
                </select>
            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-cancel"
                    onclick="tutupModal()">
                    Batal
                </button>

                <button
                    type="submit"
                    class="btn-primary">
                    Simpan
                </button>

            </div>

        </form>

    </div>

    /* ===============================
       RENDER DATA
    =============================== */

    function renderData() {

        const table = document.getElementById("dataTable");

        const search =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

        const filtered = dataSarpras.filter(item =>
            item.nama.toLowerCase().includes(search)
        );

        table.innerHTML = "";

        if (filtered.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        Data sarana dan prasarana tidak ditemukan.
                    </td>
                </tr>
            `;

            return;
        }


        filtered.forEach((item, index) => {

            let statusClass = "tersedia";

            if (item.status === "Dipinjam") {
                statusClass = "dipinjam";
            }

            if (item.status === "Dalam Perawatan") {
                statusClass = "perawatan";
            }

            if (item.status === "Tidak Tersedia") {
                statusClass = "tidak";
            }


            let kondisiClass = "baik";

            if (item.kondisi === "Rusak Ringan") {
                kondisiClass = "rusak-ringan";
            }

            if (item.kondisi === "Rusak Berat") {
                kondisiClass = "rusak-berat";
            }


            table.innerHTML += `

                <tr>

                    <td>${index + 1}</td>

                    <td>
                        <strong>${item.nama}</strong>
                    </td>

                    <td>${item.kategori}</td>

                    <td>${item.kapasitas}</td>

                    <td class="${kondisiClass}">
                        ${item.kondisi}
                    </td>

                    <td>
                        <span class="badge ${statusClass}">
                            ${item.status}
                        </span>
                    </td>

                    <td>

                        <button
                            class="btn-edit"
                            onclick="editData('${item.id}')">
                            Edit
                        </button>

                        <button
                            class="btn-delete"
                            onclick="hapusData('${item.id}')">
                            Hapus
                        </button>

                    </td>

                </tr>
            `;

        });

    }

    /* ===============================
       EDIT DATA
    =============================== */

        const item = dataSarpras.find(
            data => data.id === id
        );

            "Edit Sarpras";

            item.nama;

        document.getElementById("kategori").value =
            item.kategori;

        document.getElementById("kapasitas").value =
            item.kapasitas;

        document.getElementById("kondisi").value =
            item.kondisi;

        document.getElementById("status").value =
            item.status;

        document.getElementById("modal").style.display =
            "flex";
    }
