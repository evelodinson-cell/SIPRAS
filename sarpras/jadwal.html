<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Sarpras - SIPRAS</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: #0f2747;
      color: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .logo h2 {
      margin: 8px 0;
    }

    .logo p {
      font-size: 10px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 11px;
      margin: 4px 0;
      border-radius: 7px;
    }

    .menu a:hover,
    .menu a.active {
      background: #1d4ed8;
    }

    .logout {
      background: #dc2626 !important;
      text-align: center;
      margin-top: 15px !important;
    }

    .content {
      margin-left: 230px;
      padding: 30px;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 5px;
      color: #0f2747;
    }

    .header p {
      margin: 0;
      color: #64748b;
    }

    .toolbar {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .toolbar input {
      width: 100%;
      max-width: 400px;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      box-sizing: border-box;
    }

    .table-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f1f5f9;
      color: #0f2747;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #dcfce7;
      color: #166534;
    }

    .kosong {
      text-align: center;
      color: #64748b;
      padding: 30px;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .content {
        margin-left: 0;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">

      <img
        src="../logosipras.png"
        alt="Logo SIPRAS"
      >

      <h2>SIPRAS</h2>

      <p>
        Sistem Informasi Sarana dan Prasarana Sekolah
      </p>

    </div>


    <div class="menu">

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="pengajuan.html">
        Pengajuan
      </a>

      <a href="jadwal.html" class="active">
        Jadwal
      </a>

      <a href="data-sarpras.html">
        Data Sarpras
      </a>

      <a href="organisasi.html">
        Data Organisasi
      </a>

      <a href="riwayat.html">
        Riwayat
      </a>

      <a href="laporan.html">
        Laporan
      </a>

      <a
        href="#"
        class="logout"
        onclick="logout()"
      >
        Keluar
      </a>

    </div>

  </aside>


  <main class="content">

    <div class="header">

      <h1>Jadwal Penggunaan Sarpras</h1>

      <p>
        Daftar penggunaan sarana dan prasarana yang telah disetujui.
      </p>

    </div>


    <div class="toolbar">

      <input
        type="text"
        id="search"
        placeholder="Cari organisasi atau sarpras..."
      >

    </div>


    <div class="table-box">

      <table>

        <thead>

          <tr>
            <th>ID Pengajuan</th>
            <th>Organisasi</th>
            <th>Sarpras</th>
            <th>Tanggal</th>
            <th>Waktu</th>
            <th>Keperluan</th>
            <th>Status</th>
          </tr>

        </thead>

        <tbody id="tabelJadwal"></tbody>

      </table>

    </div>

  </main>


  <script>

    // =========================
    // PROTEKSI HALAMAN
    // =========================

    if (
      sessionStorage.getItem("siprasLoggedIn") !== "true" ||
      sessionStorage.getItem("siprasRole") !== "sarpras"
    ) {

      window.location.href = "../login.html";

    }


    // =========================
    // AMBIL DATA
    // =========================

    function ambilData() {

      return JSON.parse(
        localStorage.getItem("dataPeminjaman") || "[]"
      );

    }


    // =========================
    // TAMPILKAN JADWAL
    // =========================

    function tampilkanJadwal() {

      const data =
        ambilData();


      const keyword =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const jadwal =
        data.filter(item => {

          // Hanya pengajuan yang disetujui
          if (item.status !== "Disetujui") {
            return false;
          }


          // Filter pencarian
          if (!keyword) {
            return true;
          }


          return (
            (item.organisasi || "")
              .toLowerCase()
              .includes(keyword) ||

            (item.sarpras || "")
              .toLowerCase()
              .includes(keyword)
          );

        });


      const tabel =
        document.getElementById("tabelJadwal");


      tabel.innerHTML = "";


      if (jadwal.length === 0) {

        tabel.innerHTML = `
          <tr>
            <td colspan="7" class="kosong">
              Belum ada jadwal penggunaan yang disetujui.
            </td>
          </tr>
        `;

        return;

      }


      // Urutkan berdasarkan tanggal dan jam
      jadwal.sort((a, b) => {

        const waktuA =
          `${a.tanggal} ${a.jamMulai}`;

        const waktuB =
          `${b.tanggal} ${b.jamMulai}`;

        return waktuA.localeCompare(waktuB);

      });


      jadwal.forEach(item => {

        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${item.id || "-"}
          </td>

          <td>
            ${item.organisasi || "-"}
          </td>

          <td>
            ${item.sarpras || "-"}
          </td>

          <td>
            ${item.tanggal || "-"}
          </td>

          <td>
            ${item.jamMulai || "-"}
            -
            ${item.jamSelesai || "-"}
          </td>

          <td>
            ${item.keperluan || "-"}
          </td>

          <td>
            <span class="status">
              Disetujui
            </span>
          </td>

        `;


        tabel.appendChild(row);

      });

    }


    // =========================
    // SEARCH
    // =========================

    document
      .getElementById("search")
      .addEventListener(
        "input",
        tampilkanJadwal
      );


    // =========================
    // LOGOUT
    // =========================

    function logout() {

      sessionStorage.clear();

      window.location.href =
        "../login.html";

    }


    tampilkanJadwal();

  </script>

</body>
</html>
