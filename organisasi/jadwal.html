<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal - SIPRAS</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 230px;
      height: 100vh;
      background: #0f2747;
      color: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .logo h2 {
      margin: 8px 0 0;
    }

    .logo p {
      font-size: 11px;
      margin: 5px 0;
      color: #cbd5e1;
    }

    .menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 5px 0;
      border-radius: 7px;
    }

    .menu a:hover,
    .menu a.active {
      background: #1d4ed8;
    }

    .logout {
      margin-top: 20px;
      background: #dc2626 !important;
      text-align: center;
    }

    .content {
      margin-left: 230px;
      padding: 30px;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 5px;
      color: #0f2747;
    }

    .header p {
      margin: 0;
      color: #64748b;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th {
      background: #0f2747;
      color: white;
      padding: 12px;
      text-align: left;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 13px;
      font-weight: bold;
    }

    .kosong {
      text-align: center;
      color: #64748b;
      padding: 30px;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .content {
        margin-left: 0;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      <img src="../logosipras.png" alt="Logo SIPRAS">
      <h2>SIPRAS</h2>
      <p>Sistem Informasi Sarana dan Prasarana Sekolah</p>
    </div>

    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="profil.html">Profil Organisasi</a>
      <a href="sarpras.html">Data Sarpras</a>
      <a href="pengajuan.html">Pengajuan</a>
      <a href="jadwal.html" class="active">Jadwal</a>
      <a href="riwayat.html">Riwayat</a>
      <a href="#" class="logout" onclick="logout()">Keluar</a>
    </div>

  </aside>

  <main class="content">

    <div class="header">
      <h1>Jadwal Penggunaan Sarpras</h1>
      <p>Daftar penggunaan sarana dan prasarana yang telah disetujui.</p>
    </div>

    <div class="card">

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Sarpras</th>
            <th>Tanggal</th>
            <th>Jam</th>
            <th>Keperluan</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="jadwalTable"></tbody>
      </table>

    </div>

  </main>

  <script>
    // Proteksi halaman
    if (
      sessionStorage.getItem("siprasLoggedIn") !== "true" ||
      sessionStorage.getItem("siprasRole") !== "organisasi"
    ) {
      window.location.href = "../login.html";
    }

    const data = JSON.parse(
      localStorage.getItem("dataPeminjaman") || "[]"
    );

    const jadwal = data.filter(item =>
      item.status === "Disetujui"
    );

    const table = document.getElementById("jadwalTable");

    if (jadwal.length === 0) {
      table.innerHTML = `
        <tr>
          <td colspan="6" class="kosong">
            Belum ada jadwal penggunaan sarpras yang disetujui.
          </td>
        </tr>
      `;
    } else {

      jadwal.sort((a, b) => {
        return new Date(a.tanggal + " " + a.jamMulai) -
               new Date(b.tanggal + " " + b.jamMulai);
      });

      jadwal.forEach((item, index) => {

        table.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${item.sarpras}</td>
            <td>${formatTanggal(item.tanggal)}</td>
            <td>${item.jamMulai} - ${item.jamSelesai}</td>
            <td>${item.keperluan}</td>
            <td>
              <span class="status">${item.status}</span>
            </td>
          </tr>
        `;
      });
    }

    function formatTanggal(tanggal) {
      const date = new Date(tanggal + "T00:00:00");

      return date.toLocaleDateString("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric"
      });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "../login.html";
    }
  </script>

</body>
</html>
