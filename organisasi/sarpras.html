<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Sarpras - SIPRAS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #1e3a8a;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 70px;
            margin-bottom: 10px;
        }

        .logo h2 {
            font-size: 20px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2563eb;
        }

        .logout {
            margin-top: 25px;
            background: #dc2626 !important;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .header {
            background: white;
            padding: 22px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h1 {
            color: #1e3a8a;
            margin-bottom: 6px;
        }

        .header p {
            color: #666;
        }

        .filters {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .filters input,
        .filters select {
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .filters input {
            flex: 1;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 13px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .tersedia {
            background: #dcfce7;
            color: #166534;
        }

        .dipinjam {
            background: #fef3c7;
            color: #92400e;
        }

        .perawatan {
            background: #dbeafe;
            color: #1e40af;
        }

        .tidak {
            background: #fee2e2;
            color: #991b1b;
        }

        .baik {
            color: #166534;
            font-weight: bold;
        }

        .rusak-ringan {
            color: #b45309;
            font-weight: bold;
        }

        .rusak-berat {
            color: #b91c1c;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #777;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
            }

            .filters {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        <img src="../logosipras.png" alt="Logo SIPRAS">
        <h2>SIPRAS</h2>
    </div>

    <div class="menu">

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="sarpras.html" class="active">
            🏫 Daftar Sarpras
        </a>

        <a href="pengajuan.html">
            📝 Buat Pengajuan
        </a>

        <a href="jadwal.html">
            📅 Jadwal
        </a>

        <a href="riwayat.html">
            📋 Riwayat
        </a>

        <a href="profil.html">
            👤 Profil
        </a>

        <a href="#" class="logout" onclick="logout()">
            🚪 Logout
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="main">

    <div class="header">

        <h1>Daftar Sarana & Prasarana</h1>

        <p>
            Lihat sarana dan prasarana sekolah yang dapat digunakan untuk kegiatan organisasi.
        </p>

    </div>


    <!-- FILTER -->

    <div class="filters">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari sarana/prasarana..."
            onkeyup="renderData()"
        >

        <select
            id="kategoriFilter"
            onchange="renderData()"
        >

            <option value="Semua">
                Semua Kategori
            </option>

            <option value="Sarana">
                Sarana
            </option>

            <option value="Prasarana">
                Prasarana
            </option>

        </select>

        <select
            id="statusFilter"
            onchange="renderData()"
        >

            <option value="Semua">
                Semua Status
            </option>

            <option value="Tersedia">
                Tersedia
            </option>

            <option value="Dipinjam">
                Dipinjam
            </option>

            <option value="Dalam Perawatan">
                Dalam Perawatan
            </option>

            <option value="Tidak Tersedia">
                Tidak Tersedia
            </option>

        </select>

    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>No</th>

                    <th>Nama Sarpras</th>

                    <th>Kategori</th>

                    <th>Kapasitas/Jumlah</th>

                    <th>Kondisi</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="dataTable"></tbody>

        </table>

    </div>

</div>


<script>

    /* ===============================
       CEK LOGIN
    =============================== */

    const loggedIn =
        sessionStorage.getItem("siprasLoggedIn");

    const role =
        sessionStorage.getItem("siprasRole");


    if (
        loggedIn !== "true" ||
        role !== "organisasi"
    ) {

        window.location.href =
            "../login.html";

    }


    /* ===============================
       AMBIL DATA SARPRAS
    =============================== */

    let dataSarpras =
        JSON.parse(
            localStorage.getItem("dataSarpras")
        ) || [];


    /* ===============================
       RENDER DATA
    =============================== */

    function renderData() {

        const table =
            document.getElementById("dataTable");

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();

        const kategori =
            document
                .getElementById("kategoriFilter")
                .value;

        const status =
            document
                .getElementById("statusFilter")
                .value;


        const filtered =
            dataSarpras.filter(item => {

                const cocokNama =
                    item.nama
                        .toLowerCase()
                        .includes(search);


                const cocokKategori =
                    kategori === "Semua" ||
                    item.kategori === kategori;


                const cocokStatus =
                    status === "Semua" ||
                    item.status === status;


                return (
                    cocokNama &&
                    cocokKategori &&
                    cocokStatus
                );

            });


        table.innerHTML = "";


        if (filtered.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty"
                    >

                        Tidak ada data sarana dan prasarana.

                    </td>

                </tr>

            `;

            return;

        }


        filtered.forEach((item, index) => {

            let statusClass =
                "tersedia";


            if (
                item.status === "Dipinjam"
            ) {

                statusClass =
                    "dipinjam";

            }


            if (
                item.status ===
                "Dalam Perawatan"
            ) {

                statusClass =
                    "perawatan";

            }


            if (
                item.status ===
                "Tidak Tersedia"
            ) {

                statusClass =
                    "tidak";

            }


            let kondisiClass =
                "baik";


            if (
                item.kondisi ===
                "Rusak Ringan"
            ) {

                kondisiClass =
                    "rusak-ringan";

            }


            if (
                item.kondisi ===
                "Rusak Berat"
            ) {

                kondisiClass =
                    "rusak-berat";

            }


            table.innerHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${item.nama}
                        </strong>
                    </td>

                    <td>
                        ${item.kategori}
                    </td>

                    <td>
                        ${item.kapasitas}
                    </td>

                    <td
                        class="${kondisiClass}"
                    >
                        ${item.kondisi}
                    </td>

                    <td>

                        <span
                            class="badge ${statusClass}"
                        >
                            ${item.status}
                        </span>

                    </td>

                </tr>

            `;

        });

    }


    /* ===============================
       LOGOUT
    =============================== */

    function logout() {

        const yakin =
            confirm(
                "Apakah Anda yakin ingin keluar?"
            );


        if (!yakin) {
            return;
        }


        sessionStorage.clear();


        window.location.href =
            "../login.html";

    }


    /* ===============================
       UPDATE DATA SAAT HALAMAN DIBUKA
    =============================== */

    renderData();

</script>

</body>
</html>
